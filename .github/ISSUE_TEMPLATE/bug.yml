name: 报告问题
description: 反馈 SDK 使用问题或文档差异
body:
  - type: input
    id: version
    attributes:
      label: SDK 版本
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: goversion
    attributes:
      label: Go 版本
      placeholder: go version go1.24.0 darwin/arm64
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现代码或步骤
      description: 请提供可运行的最小示例，并移除密钥、访问令牌、真实订单号、支付链接和客户信息。
      render: go
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
